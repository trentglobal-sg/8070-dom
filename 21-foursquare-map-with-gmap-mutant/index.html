<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>

<body>
    <div id="map-container">
        <div id="search-container">
            <div class="tabs">
                <button class="tab-btn active" data-tab="search">Search</button>
                <button class="tab-btn" data-tab="recommend">AI Recommend</button>
            </div>
            
            <div id="search-tab" class="tab-content active">
                <input type="text" id="search-terms"/>
                <button id="search-btn">Search</button>
                <div id="search-loading" class="loading"></div>
                <div id="search-error" class="error"></div>
                <div id="search-results"></div>
            </div>
            
            <div id="recommend-tab" class="tab-content">
                <input type="text" id="recommend-terms"/>
                <button id="recommend-btn">Get Recommendations</button>
                <div id="recommend-loading" class="loading"></div>
                <div id="recommend-error" class="error"></div>
                <div id="recommend-results"></div>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <!-- Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAHKOPI4v_BrKpWD7FQo9EY3sRUuh8kGDg"></script>

    <!-- Leaflet -->
   <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Leaflet.GridLayer.GoogleMutant -->
    <script src="https://unpkg.com/leaflet.gridlayer.googlemutant@latest/dist/Leaflet.GoogleMutant.js"></script>

    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.12.2/dist/axios.min.js"></script>

    <!-- Our own scripts -->
    <script src="data.js"></script>
    <script src="map.js"></script>
    <script src="script.js"></script>
</body>

</html>
